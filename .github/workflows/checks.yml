name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt -r requirements-build.txt
      - run: python -B -m unittest discover -s tests -v
      - run: python core/test.py
      - run: cmake -S gat_cpp -B gat_cpp/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build gat_cpp/build --parallel 2
      - run: python gat_cpp/tools/run_parallel_smoke.py --playout 32 --threads 2
